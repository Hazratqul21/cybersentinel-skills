[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersentinel-skills"
version = "0.1.0"
description = "Universal cybersecurity skill library and validator for AI agents (Agent Skills format)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "CyberSentinel Skills contributors" }]
keywords = ["security", "red-team", "blue-team", "ai-security", "agent-skills", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
# Core tooling is intentionally dependency-free (stdlib only) so the validator
# runs in any environment, including air-gapped labs.
dependencies = []

[project.optional-dependencies]
# PyYAML gives full-fidelity frontmatter parsing; the built-in mini-parser is
# used automatically when it is absent.
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7.0", "PyYAML>=6.0"]

[project.scripts]
cybersentinel = "cybersentinel.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/cybersentinel-skills"
Issues = "https://github.com/your-org/cybersentinel-skills/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
